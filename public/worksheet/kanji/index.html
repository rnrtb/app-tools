<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ラボ式・漢字プリントメーカー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --font-kyokasho: "UD Digi Kyokasho NP", "UD Digi Kyokasho N", "UDデジタル教科書体 NP", "UDデジタル教科書体 N", "BIZ UDPGothic", "BIZ UDGothic", sans-serif;
      --font-gothic: "BIZ UDPGothic", "BIZ UDGothic", sans-serif;
      --kanji-scale: 1;
      --yomi-scale: 1;
      --id-scale: 1;
      --title-scale: 1;
      --yomi-h-scale: 1;
      --practice-rows: 3;
      --kanji-pt: 24.2pt;
      --yomi-pt: 10.45pt;
      --id-pt: 9pt;
      --title-pt: 10.5pt;
      --label-kanji-pt: 11pt;
      --label-yomi-pt: 10.45pt;
      --half-label: 8.8mm;
      --half-kanji-pt: 32pt;
      --half-yomi-pt: 13pt;
      --half-kanji-h: 50.8mm;
      --half-mark-h: 6.2mm;
      --half-yomi-h: calc(49.2mm * var(--yomi-h-scale));
      --half-practice-rows: 10;
      --half-cols: 10;
      --half-grid: #9ed8ea;
      --std-line: #767171;
      --std-orange: #ff6600;
      --std-num-orange: #ed7d31;
      --std-label: 5.2mm;
      --std-meta-w: 16mm;
      --std-spacer-h: 3.5mm;
      --std-yomi-h: calc(32.5mm * var(--yomi-h-scale));
      --yomi-col-gap: 1.5mm;
      --std-num-shift: 0.5mm;
      --std-num-hshift: 0.35mm;
      --twin-gap: 5mm;
      --twin-kanji-pt: 20.7pt;
      --twin-yomi-pt: 9pt;
      --twin-yomi-h: calc(34.5mm * var(--yomi-h-scale));
      --twin-spacer-h: 2.8mm;
      --twin-id-pt: 6.21pt;
      --twin-title-pt: 16.8pt;
      --twin-num-shift: 0.32mm;
      --twin-num-hshift: 0.22mm;
      --test-gap: 16mm;
      --test-meta-w: 14mm;
      --test-pad-x: 8mm;
      --test-pad-y: 8mm;
      --test-cut-inset: 8mm;
      --test-row-gap: 8mm;
      --test-yomi-pt: 13pt;
    }
    * { box-sizing: border-box; }
    body { font-family: var(--font-gothic); }

    .print-paper {
      font-family: var(--font-kyokasho);
      background: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin: 0 auto;
      flex-shrink: 0;
    }
    .print-paper.font-gothic {
      font-family: var(--font-gothic);
    }
    .template-standard {
      width: 297mm;
      height: 210mm;
      min-width: 297mm;
      min-height: 210mm;
      max-width: 297mm;
      max-height: 210mm;
      padding: 11.5mm 8mm 11.5mm 11.5mm;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      overflow: hidden;
    }
    .template-half {
      width: 210mm;
      height: 297mm;
      min-width: 210mm;
      min-height: 297mm;
      max-width: 210mm;
      max-height: 297mm;
      padding: 12.7mm 10mm 13.6mm 13.1mm;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      overflow: hidden;
    }
    .template-twin {
      width: 210mm;
      height: 297mm;
      min-width: 210mm;
      min-height: 297mm;
      max-width: 210mm;
      max-height: 297mm;
      padding: 12.7mm 11.5mm 13.6mm 11.5mm;
      display: flex;
      flex-direction: column;
      gap: var(--twin-gap);
      overflow: hidden;
    }
    .template-test {
      width: 210mm;
      height: 297mm;
      min-width: 210mm;
      min-height: 297mm;
      max-width: 210mm;
      max-height: 297mm;
      padding: var(--test-pad-y) var(--test-pad-x);
      display: flex;
      flex-direction: column;
      gap: var(--test-gap);
      overflow: hidden;
    }

    /* ===== スタンダード（A4横・縦書き） ===== */
    .std-table {
      flex: 1 1 auto;
      width: 0;
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: row-reverse;
      justify-content: flex-start;
      align-items: stretch;
      overflow: hidden;
      border-top: 0.5pt solid var(--std-line);
      border-left: 0.5pt solid var(--std-line);
    }
    .std-col {
      flex: 1 0 0;
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .std-col.label {
      width: var(--std-label);
      flex: 0 0 var(--std-label);
    }
    .std-col.label .std-cell {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      display: flex;
      justify-content: center;
      align-items: center;
      line-height: 1;
      min-height: 0;
    }
    .std-col.label .std-cell.std-kanji,
    .std-col.label .std-cell.std-practice {
      font-size: var(--label-kanji-pt);
    }
    .std-col.label .std-cell.std-kanji {
      padding-top: 0.8mm;
    }
    .std-col.label .std-cell.std-yomi {
      font-size: var(--label-yomi-pt);
      padding: 1.2mm 0 1mm;
    }
    .std-cell {
      border-right: 0.5pt solid var(--std-line);
      border-bottom: 0.5pt solid var(--std-line);
      overflow: hidden;
      min-height: 0;
    }
    .std-kanji,
    .std-yomi,
    .std-practice {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .std-kanji,
    .std-practice {
      flex: 0 0 calc((100% - var(--std-spacer-h) - var(--std-yomi-h)) / (1 + var(--practice-rows)));
      height: calc((100% - var(--std-spacer-h) - var(--std-yomi-h)) / (1 + var(--practice-rows)));
      min-height: 0;
    }
    .std-kanji {
      font-size: calc(var(--kanji-pt) * var(--kanji-scale));
      line-height: 1;
      padding-top: 0.8mm;
    }
    .std-spacer {
      flex: 0 0 var(--std-spacer-h);
      height: var(--std-spacer-h);
      min-height: 0;
    }
    .std-yomi {
      flex: 0 0 var(--std-yomi-h);
      height: var(--std-yomi-h);
      min-height: 0;
      font-size: calc(var(--yomi-pt) * var(--yomi-scale));
      line-height: 1;
      padding: 1.2mm 0 1mm;
    }
    .std-vtext {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      line-height: 1;
    }
    .std-yomi .std-vtext,
    .half-yomi .std-vtext,
    .test-q-yomi .std-vtext {
      display: flex;
      flex-direction: row-reverse;
      justify-content: center;
      align-items: flex-start;
      writing-mode: horizontal-tb;
      height: 100%;
      max-height: 100%;
      overflow: hidden;
      gap: var(--yomi-col-gap);
    }
    .std-yomi .yomi-col,
    .half-yomi .yomi-col,
    .test-q-yomi .yomi-col {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      line-height: calc(1em + var(--yomi-col-gap));
      height: 100%;
      max-height: 100%;
      flex: 0 0 auto;
      white-space: normal;
    }
    .yomi-hl {
      position: relative;
      color: var(--std-orange);
      display: inline-block;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      line-height: inherit;
      max-height: 100%;
      padding-right: 0;
      white-space: normal;
    }
    .yomi-hl::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0.08em;
      width: 0;
      border-right: 1px solid currentColor;
      pointer-events: none;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .std-meta {
      width: var(--std-meta-w);
      flex: 0 0 var(--std-meta-w);
      align-self: stretch;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 0;
    }
    .std-id {
      font-size: calc(var(--id-pt) * var(--id-scale));
      letter-spacing: 0.04em;
      line-height: 1;
      margin: 0 0 0.8mm;
      white-space: nowrap;
      color: #262626;
    }
    .std-num {
      width: 12mm;
      height: 12.8mm;
      border: 2.2pt solid var(--std-num-orange);
      border-radius: 2mm;
      color: var(--std-num-orange);
      font-family: "UD Digi Kyokasho N", "UDデジタル教科書体 N", "BIZ UDPGothic", "BIZ UDGothic", sans-serif;
      font-weight: 400;
      font-size: 22pt;
      font-variant-numeric: tabular-nums lining-nums;
      font-feature-settings: "hwid" 1;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      margin-bottom: 2mm;
    }
    .std-num-text {
      display: block;
      line-height: 1;
      transform: translateY(var(--std-num-shift));
    }
    .print-paper:not(.font-gothic) .std-num-text--lead-one {
      transform: translateY(var(--std-num-shift)) translateX(calc(-1 * var(--std-num-hshift)));
    }
    .print-paper:not(.font-gothic) .std-num-text--trail-one {
      transform: translateY(var(--std-num-shift)) translateX(var(--std-num-hshift));
    }
    .std-title {
      display: flex;
      flex-direction: row-reverse;
      justify-content: center;
      align-items: flex-start;
      gap: 0.5mm;
      max-width: 100%;
      min-height: 0;
      overflow: hidden;
    }
    .std-title-line {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: calc(var(--title-pt) * var(--title-scale));
      line-height: 1;
      color: #262626;
      flex-shrink: 0;
    }
    .std-title-wrap {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 0;
      width: 100%;
    }
    .std-logo {
      width: 6.3mm;
      height: 6.3mm;
      object-fit: contain;
      flex-shrink: 0;
      margin-top: auto;
    }

    /* ツイン（A4縦・上12下13） */
    .twin-top,
    .twin-bottom {
      flex: 1 1 0;
      min-height: 0;
      min-width: 0;
    }
    .twin-top {
      display: flex;
      flex-direction: row;
      align-items: stretch;
    }
    .twin-table {
      display: flex;
      flex-direction: row-reverse;
      justify-content: flex-start;
      align-items: stretch;
      overflow: hidden;
      border-top: 0.5pt solid var(--std-line);
      border-left: 0.5pt solid var(--std-line);
      min-width: 0;
      min-height: 0;
      height: 100%;
    }
    .twin-top .twin-table {
      flex: 0 0 calc(100% - (100% - var(--std-label)) / 13);
      width: calc(100% - (100% - var(--std-label)) / 13);
    }
    .twin-bottom .twin-table {
      width: 100%;
    }
    .twin-meta.std-meta {
      width: auto;
      flex: 1 1 0;
      min-width: 0;
      padding-left: 0.8mm;
    }
    .template-twin .std-kanji {
      font-size: calc(var(--twin-kanji-pt) * var(--kanji-scale));
    }
    .template-twin .std-yomi {
      font-size: calc(var(--twin-yomi-pt) * var(--yomi-scale));
      flex-basis: var(--twin-yomi-h);
      height: var(--twin-yomi-h);
    }
    .template-twin .std-spacer {
      flex-basis: var(--twin-spacer-h);
      height: var(--twin-spacer-h);
    }
    .template-twin .std-kanji,
    .template-twin .std-practice {
      flex: 0 0 calc((100% - var(--twin-spacer-h) - var(--twin-yomi-h)) / (1 + var(--practice-rows)));
      height: calc((100% - var(--twin-spacer-h) - var(--twin-yomi-h)) / (1 + var(--practice-rows)));
    }
    .twin-meta .std-title-wrap {
      flex: 0 0 auto;
    }
    .template-twin .std-num {
      width: 8.5mm;
      height: 8.5mm;
      font-size: 14pt;
      border-width: 1.7pt;
      border-radius: 1.4mm;
      margin-top: 2mm;
      margin-bottom: 0;
    }
    .template-twin .std-num-text {
      transform: translateY(var(--twin-num-shift));
    }
    .print-paper.template-twin:not(.font-gothic) .std-num-text--lead-one {
      transform: translateY(var(--twin-num-shift)) translateX(calc(-1 * var(--twin-num-hshift)));
    }
    .print-paper.template-twin:not(.font-gothic) .std-num-text--trail-one {
      transform: translateY(var(--twin-num-shift)) translateX(var(--twin-num-hshift));
    }
    .template-twin .std-logo {
      margin-top: auto;
    }
    .template-twin .std-id {
      font-family: var(--font-gothic);
      font-size: calc(var(--twin-id-pt) * var(--id-scale));
    }
    .template-twin .std-title-line {
      font-size: calc(var(--twin-title-pt) * var(--title-scale));
    }

    /* テスト（A4縦・5問4行） */
    .test-half {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 2mm;
      position: relative;
    }
    .test-half + .test-half::before {
      content: "";
      position: absolute;
      left: calc(var(--test-cut-inset) - var(--test-pad-x));
      right: calc(var(--test-cut-inset) - var(--test-pad-x));
      top: calc(-0.5 * var(--test-gap));
      border-top: 0.6pt dashed #b0b0b0;
    }
    .test-header {
      width: var(--test-meta-w);
      flex: 0 0 var(--test-meta-w);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 0;
      min-width: 0;
    }
    .test-header .std-id {
      margin: 0 0 0.8mm;
      flex-shrink: 0;
    }
    .test-header .std-num {
      margin: 0 0 1.5mm;
      flex-shrink: 0;
      width: 9mm;
      height: 9mm;
      font-size: 15pt;
      border-width: 1.8pt;
    }
    .test-header .std-title-wrap {
      flex: 1 1 0;
      width: 100%;
      flex-direction: column;
      align-items: center;
      min-height: 0;
      overflow: hidden;
    }
    .test-header .std-title {
      flex-direction: row-reverse;
      justify-content: center;
      align-items: flex-start;
      gap: 0.5mm;
      max-width: 100%;
    }
    .test-header .std-title-line {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: calc(10.5pt * var(--title-scale));
      line-height: 1;
      white-space: normal;
      overflow: hidden;
    }
    .test-header .std-logo {
      margin-top: auto;
      width: 6.3mm;
      height: 6.3mm;
    }
    .test-grid {
      flex: 1 1 0;
      width: 0;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: var(--test-row-gap);
    }
    .test-row {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      flex-direction: row-reverse;
      gap: 4.5mm;
    }
    .test-q {
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto minmax(0, 1fr);
      column-gap: 0.4mm;
      row-gap: 0.4mm;
    }
    .test-q-num {
      grid-column: 2;
      grid-row: 1;
      padding: 0.2mm 0.4mm 0;
      font-size: calc(var(--test-yomi-pt) * var(--yomi-scale));
      line-height: 1;
      color: #444;
      text-align: center;
    }
    .test-q-yomi {
      grid-column: 2;
      grid-row: 2;
      min-height: 0;
      min-width: 0;
      padding: 0 0.2mm 0.8mm;
      overflow: hidden;
      font-size: calc(var(--test-yomi-pt) * var(--yomi-scale));
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .test-q-write {
      grid-column: 1;
      grid-row: 1 / -1;
      min-width: 0;
      min-height: 0;
      border: 0.7pt solid var(--std-line);
      background: white;
    }

    /* ハーフサイズ（A4縦・10問） */
    .preview-pages {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .half-table {
      flex: 1 1 auto;
      width: 0;
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: row-reverse;
      justify-content: flex-start;
      align-items: stretch;
      overflow: hidden;
      border-top: 0.5pt solid var(--std-line);
      border-left: 0.5pt solid var(--std-line);
      container-type: inline-size;
      --half-cell: calc((100cqw - var(--half-label)) / var(--half-cols));
    }
    .half-col {
      flex: 1 0 0;
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .half-col.label {
      width: var(--half-label);
      flex: 0 0 var(--half-label);
    }
    .half-col.label .std-cell {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      display: flex;
      justify-content: center;
      align-items: center;
      line-height: 1;
      min-height: 0;
      font-size: var(--label-kanji-pt);
      padding: 0;
    }
    .half-col.label .half-yomi {
      font-size: var(--label-yomi-pt);
    }
    .half-kanji {
      flex: 1 1 0;
      height: auto;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-size: calc(var(--half-kanji-pt) * var(--kanji-scale));
      line-height: 1;
      padding-top: 0.8mm;
    }
    .half-mark {
      flex: 0 0 var(--half-mark-h);
      height: var(--half-mark-h);
      min-height: 0;
    }
    .half-yomi {
      flex: 0 0 var(--half-yomi-h);
      height: var(--half-yomi-h);
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-size: calc(var(--half-yomi-pt) * var(--yomi-scale));
      line-height: 1;
      padding: 1.2mm 0 1mm;
    }
    .half-practice {
      flex: 0 0 var(--half-cell);
      width: 100%;
      height: var(--half-cell);
      aspect-ratio: 1 / 1;
      min-height: 0;
      position: relative;
      border-right: 0.5pt solid var(--std-line);
      border-bottom: 0.5pt solid var(--half-grid);
      background: transparent;
    }
    .half-practice:last-child {
      border-bottom-color: var(--std-line);
    }
    .half-practice::before,
    .half-practice::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }
    .half-practice::before {
      left: 50%;
      top: 0;
      bottom: 0;
      border-left: 0.4pt dashed var(--half-grid);
    }
    .half-practice::after {
      top: 50%;
      left: 0;
      right: 0;
      border-top: 0.4pt dashed var(--half-grid);
    }
    .half-label-practice {
      flex: 0 0 calc(var(--half-practice-rows) * var(--half-cell));
      height: calc(var(--half-practice-rows) * var(--half-cell));
      min-height: 0;
      border-right: 0.5pt solid var(--std-line);
      border-bottom: 0.5pt solid var(--std-line);
    }

    .preview-shell {
      flex: 1;
      min-width: 0;
      overflow: auto;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .style-panel summary {
      list-style: none;
    }
    .style-panel summary::-webkit-details-marker {
      display: none;
    }
    .style-panel summary::before {
      content: "▸";
      display: inline-block;
      width: 1em;
      color: #6b7280;
    }
    .style-panel[open] summary::before {
      content: "▾";
    }

    @media print {
      html, body {
        width: auto !important;
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: visible !important;
        background: white !important;
      }
      .no-print { display: none !important; }
      .preview-shell {
        display: block !important;
        flex: none !important;
        overflow: visible !important;
        padding: 0 !important;
        margin: 0 !important;
        width: auto !important;
        height: auto !important;
        min-width: 0 !important;
      }
      .preview-scaler {
        transform: none !important;
        width: auto !important;
        height: auto !important;
        overflow: visible !important;
      }
      .print-paper {
        box-shadow: none !important;
        margin: 0 !important;
        transform: none !important;
      }
      .preview-pages {
        display: block !important;
        gap: 0 !important;
      }
      .template-standard {
        width: 297mm !important;
        height: 210mm !important;
        min-width: 297mm !important;
        min-height: 210mm !important;
        max-width: 297mm !important;
        max-height: 210mm !important;
        padding: 11.5mm 8mm 11.5mm 11.5mm !important;
        overflow: hidden !important;
        page-break-after: avoid;
        break-after: avoid-page;
      }
      .template-half {
        width: 210mm !important;
        height: 297mm !important;
        min-width: 210mm !important;
        min-height: 297mm !important;
        max-width: 210mm !important;

  <div id="previewShell" class="preview-shell">
    <div id="previewScaler" class="preview-scaler">
      <div id="previewArea" class="print-paper template-standard"></div>

  <script>
    const STANDARD_COLS = 20;
    const HALF_COLS = 10;
    const TWIN_TOP_COLS = 12;
    const TWIN_BOTTOM_COLS = 13;
    const TEST_COLS = 5;
    const TEST_ROWS_PER_HALF = 2;
    const TEST_PER_HALF = TEST_COLS * TEST_ROWS_PER_HALF;
    const TEST_PER_PAGE = TEST_PER_HALF * 2;
    const PRACTICE_ROUND_MIN = 1;
    const PRACTICE_ROUND_MAX = 6;
    const HALF_CELL_MIN = 5;
    const HALF_CELL_MAX = 15;
    const CIRCLED_NUMS = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨', '⑩'];

    const input = document.getElementById('kanjiInput');
    const templateSelect = document.getElementById('templateSelect');
    const previewArea = document.getElementById('previewArea');
    const previewShell = document.getElementById('previewShell');
    const previewScaler = document.getElementById('previewScaler');
    const printPageStyle = document.getElementById('printPageStyle');
    const fontSelect = document.getElementById('fontSelect');
    const kanjiSizeSlider = document.getElementById('kanjiSizeSlider');
    const kanjiSizeDisplay = document.getElementById('kanjiSizeDisplay');
    const yomiSizeSlider = document.getElementById('yomiSizeSlider');
    const yomiSizeDisplay = document.getElementById('yomiSizeDisplay');
    const yomiHeightSlider = document.getElementById('yomiHeightSlider');
    const yomiHeightDisplay = document.getElementById('yomiHeightDisplay');
    const idSizeSlider = document.getElementById('idSizeSlider');
    const idSizeDisplay = document.getElementById('idSizeDisplay');
    const titleSizeSlider = document.getElementById('titleSizeSlider');
    const titleSizeDisplay = document.getElementById('titleSizeDisplay');
    const practiceCountSlider = document.getElementById('practiceCountSlider');
    const practiceCountDisplay = document.getElementById('practiceCountDisplay');
    const practiceCountLabel = document.getElementById('practiceCountLabel');
    const titleInput = document.getElementById('titleInput');
    const numberInput = document.getElementById('numberInput');
    const idInput = document.getElementById('idInput');

    function toHalfWidthDigits(str) {
      return String(str).replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getTitleLines(raw) {
      return String(raw).split(/\r?\n/).slice(0, 3).map(line => line.trimEnd());
    }

    function formatTitleVerticalHtml(raw) {
      return getTitleLines(raw)
        .filter(line => line.length > 0)
        .map(line => {
          const html = escapeHtml(line).replace(/\r?\n/g, '<br>');
          return `<span class="std-title-line">${html}</span>`;
        })
        .join('');
    }

    function formatYomiHtml(rawSentence) {
      const source = escapeHtml(rawSentence);
      let html = '';
      let inQuote = false;

      const lineBreak = () => {
        if (inQuote) html += '</span><br><span class="yomi-hl">';
        else html += '<br>';
      };

      for (const ch of source) {
        if (ch === '「') {
          inQuote = true;
          html += '<span class="yomi-hl">';
          continue;
        }
        if (ch === '」') {
          inQuote = false;
          html += '</span>';
          continue;
        }
        if (ch === '、' || ch === '\n' || ch === '\r') {
          if (ch === '\r') continue;
          lineBreak();
          continue;
        }
        html += ch;
      }
      if (inQuote) html += '</span>';
      return `<span class="yomi-col">${html}</span>`;
    }

    function formatTitleBlockHtml(raw) {
      return escapeHtml(getTitleLines(raw).join('\n')).replace(/\n/g, '<br>');
    }

    function getNumTextAdjustClass(raw) {
      if (fontSelect.value !== 'kyokasho') return '';
      const digits = toHalfWidthDigits(raw).trim();
      if (!digits) return '';
      const startsWithOne = digits[0] === '1';
      const endsWithOne = digits[digits.length - 1] === '1';
      if (startsWithOne && endsWithOne) return '';
      if (startsWithOne) return 'std-num-text--lead-one';
      if (endsWithOne) return 'std-num-text--trail-one';
      return '';
    }

    function clampTitleInput() {
      const lines = titleInput.value.split(/\r?\n/);
      if (lines.length > 3) {
        titleInput.value = lines.slice(0, 3).join('\n');
      }
    }

    const META_KEY_FIELDS = [
      ['識別クラス', 'id'],
      ['識別番号', 'id'],
      ['テンプレート', 'template'],
      ['タイトル', 'title'],
      ['フォント', 'font'],
      ['template', 'template'],
      ['number', 'number'],
      ['title', 'title'],
      ['font', 'font'],
      ['番号', 'number'],
      ['数値', 'number'],
      ['id', 'id'],
    ].sort((a, b) => b[0].length - a[0].length);

    const META_KEY_PATTERN = new RegExp(
      '(' + META_KEY_FIELDS.map(([key]) => key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')\\s*[=＝]\\s*',
      'gi'
    );

    const META_FIELD_BY_KEY = Object.fromEntries(
      META_KEY_FIELDS.map(([key, field]) => [key.toLowerCase(), field])
    );

    function isCommentLine(line) {
      return /^\s*[#＃]/.test(line);
    }

    function parseFontParam(raw) {
      const value = String(raw || '').trim().toLowerCase();
      if (['gothic', 'ゴシック', 'ゴシック体', 'biz', 'biz udゴシック', 'bizudpgothic', 'biz udpgothic'].includes(value)) {
        return 'gothic';
      }
      if (['kyokasho', '教科書体', '教科書', 'ud'].includes(value)) return 'kyokasho';
      return null;
    }

    function assignMetaValue(meta, field, value) {
      if (field === 'title') {
        const next = String(value).replace(/\\n/g, '\n');
        meta.title = meta.title ? `${meta.title}\n${next}` : next;
        meta.title = meta.title.split(/\r?\n/).slice(0, 3).join('\n');
        return;
      }
      meta[field] = value;
    }

    function mergeCommentMeta(line, meta) {
      const body = line.replace(/^\s*[#＃]\s*/, '');
      META_KEY_PATTERN.lastIndex = 0;
      const match = META_KEY_PATTERN.exec(body);
      if (!match || match.index !== 0) return;
      const field = META_FIELD_BY_KEY[match[1].toLowerCase()];
      if (!field) return;
      assignMetaValue(meta, field, body.slice(match[0].length).trim());
    }

    function parseKanjiInput(text) {
      const meta = {};
      const lines = String(text).split(/\r?\n/);
      while (lines.length && lines[lines.length - 1].trim() === '') lines.pop();
      const items = [];
      for (const line of lines) {
        if (isCommentLine(line)) {
          mergeCommentMeta(line, meta);
          continue;
        }
        if (line.trim() === '') {
          items.push(null);
          continue;
        }
        const hasSep = line.includes('。');
        const parts = line.split('。');
        const kanji = parts[0].trim();
        const rawSentence = parts.slice(1).join('。').trim();
        items.push({
          kanji,
          yomiHtml: formatYomiHtml(rawSentence),
          hasSep,
        });
      }
      return { items, meta };
    }

    function parseItems() {
      return parseKanjiInput(input.value).items;
    }

    function hasMeta(meta, key) {
      return Object.prototype.hasOwnProperty.call(meta, key);
    }

    function applyMetaFromData() {
      const { meta } = parseKanjiInput(input.value);
      const titleLocked = hasMeta(meta, 'title');
      const numberLocked = hasMeta(meta, 'number');
      const idLocked = hasMeta(meta, 'id');
      const template = hasMeta(meta, 'template') ? parseTemplateParam(meta.template) : null;
      const font = hasMeta(meta, 'font') ? parseFontParam(meta.font) : null;

      if (titleLocked) {
        titleInput.value = meta.title;
        clampTitleInput();
      }
      if (numberLocked) numberInput.value = meta.number;
      if (idLocked) idInput.value = meta.id;
      if (template) {
        templateSelect.value = template;
        updatePrintPageStyle(template);
      }
      if (font) fontSelect.value = font;

      titleInput.readOnly = titleLocked;
      numberInput.readOnly = numberLocked;
      idInput.readOnly = idLocked;
      templateSelect.disabled = Boolean(template);
      fontSelect.disabled = Boolean(font);
    }

    function clampInt(value, min, max, fallback) {
      const n = Math.round(Number(value));
      if (!Number.isFinite(n)) return fallback;
      return Math.min(max, Math.max(min, n));
    }

    let savedPracticeRounds = 3;
    let savedHalfCells = 10;

    function isHalfTemplate() {
      return templateSelect.value === 'half';
    }

    function isTestTemplate() {
      return templateSelect.value === 'test';
    }

    function getPracticeCount() {
      return clampInt(savedPracticeRounds, PRACTICE_ROUND_MIN, PRACTICE_ROUND_MAX, 3);
    }

    function getHalfCellCount() {
      return clampInt(savedHalfCells, HALF_CELL_MIN, HALF_CELL_MAX, 10);
    }

    function syncPracticeSlider() {
      const half = isHalfTemplate();
      const test = isTestTemplate();
      practiceCountLabel.textContent = half ? '練習のマス数' : '練習の回数';
      practiceCountSlider.min = String(half ? HALF_CELL_MIN : PRACTICE_ROUND_MIN);
      practiceCountSlider.max = String(half ? HALF_CELL_MAX : PRACTICE_ROUND_MAX);
      practiceCountSlider.value = String(half ? getHalfCellCount() : getPracticeCount());
      practiceCountDisplay.textContent = practiceCountSlider.value;
      practiceCountSlider.disabled = test;
      kanjiSizeSlider.disabled = test;
      document.getElementById('kanjiSizeField').classList.toggle('opacity-40', test);
    }

    function readPracticeSlider() {
      if (isTestTemplate()) return;
      if (isHalfTemplate()) {
        savedHalfCells = clampInt(practiceCountSlider.value, HALF_CELL_MIN, HALF_CELL_MAX, 10);
      } else {
        savedPracticeRounds = clampInt(practiceCountSlider.value, PRACTICE_ROUND_MIN, PRACTICE_ROUND_MAX, 3);
      }
    }

    function practiceLabelHtml() {
      const marks = ['①', '②', '③', '④', '⑤', '⑥'];
      const n = getPracticeCount();
      let html = '';
      for (let i = n; i >= 1; i--) {
        html += `<div class="std-cell std-practice">${marks[i - 1]}</div>`;
      }
      return html;
    }

    function practiceEmptyHtml() {
      return Array.from({ length: getPracticeCount() }, () => '<div class="std-cell std-practice"></div>').join('');
    }

    function questionColumn(item) {
      const kanji = item ? item.kanji : '';
      const yomi = item ? item.yomiHtml : '';
      return `
        <div class="std-col">
          <div class="std-cell std-kanji"><span class="std-vtext">${kanji}</span></div>
          <div class="std-cell std-spacer"></div>
          <div class="std-cell std-yomi"><span class="std-vtext">${yomi}</span></div>
          ${practiceEmptyHtml()}
        </div>
      `;
    }

    function renderStandard() {
      const items = parseItems();
      const emptyCount = Math.max(0, STANDARD_COLS - items.length);
      const padded = items.concat(Array(emptyCount).fill(null));
      const title = formatTitleVerticalHtml(titleInput.value);
      const number = toHalfWidthDigits(numberInput.value);
      const numAdjustClass = getNumTextAdjustClass(numberInput.value);
      const id = idInput.value;

      const colsHtml = padded.map(questionColumn).join('');

      previewArea.className = 'print-paper template-standard';
      previewArea.innerHTML = `
        <div class="std-table">
          ${standardLabelColumn()}
          ${colsHtml}
        </div>
        ${metaAsideHtml(title, number, numAdjustClass, id)}
      `;
    }

    function standardLabelColumn() {
      return `
        <div class="std-col label">
          <div class="std-cell std-kanji">漢字</div>
          <div class="std-cell std-spacer"></div>
          <div class="std-cell std-yomi">読み</div>
          ${practiceLabelHtml()}
        </div>
      `;
    }

    function numBoxHtml(number, numAdjustClass) {
      if (!String(number).trim()) return '';
      return `<div class="std-num"><span class="std-num-text ${numAdjustClass}">${escapeHtml(number)}</span></div>`;
    }

    function metaAsideHtml(title, number, numAdjustClass, id, extraClass) {
      const cls = extraClass ? `std-meta ${extraClass}` : 'std-meta';
      const numHtml = numBoxHtml(number, numAdjustClass);
      const titleHtml = `<div class="std-title">${title}</div>`;
      const logoHtml = `<img class="std-logo" src="timer_logo_v2_3.png" alt="">`;
      if (extraClass === 'twin-meta') {
        return `
          <aside class="${cls}">
            <div class="std-id">${id}</div>
            <div class="std-title-wrap">${titleHtml}</div>
            ${numHtml}
            ${logoHtml}
          </aside>
        `;
      }
      return `
        <aside class="${cls}">
          <div class="std-id">${id}</div>
          ${numHtml}
          <div class="std-title-wrap">
            ${titleHtml}
            ${logoHtml}
          </div>
        </aside>
      `;
    }

    function padItems(items, count) {
      return items.concat(Array(Math.max(0, count - items.length)).fill(null));
    }

    function renderTwin() {
      const items = parseItems();
      const title = formatTitleVerticalHtml(titleInput.value);
      const number = toHalfWidthDigits(numberInput.value);
      const numAdjustClass = getNumTextAdjustClass(numberInput.value);
      const id = idInput.value;
      const topCols = padItems(items.slice(0, TWIN_TOP_COLS), TWIN_TOP_COLS).map(questionColumn).join('');
      const bottomCols = padItems(
        items.slice(TWIN_TOP_COLS, TWIN_TOP_COLS + TWIN_BOTTOM_COLS),
        TWIN_BOTTOM_COLS
      ).map(questionColumn).join('');

      previewArea.className = 'print-paper template-twin';
      previewArea.innerHTML = `
        <div class="twin-top">
          <div class="twin-table">
            ${standardLabelColumn()}
            ${topCols}
          </div>
          ${metaAsideHtml(title, number, numAdjustClass, id, 'twin-meta')}
        </div>
        <div class="twin-bottom">
          <div class="twin-table">
            ${standardLabelColumn()}
            ${bottomCols}
          </div>
        </div>
      `;
    }

    function halfColumn(item) {
      const kanji = item ? item.kanji : '';
      const yomi = item ? item.yomiHtml : '';
      const practices = Array.from({ length: getHalfCellCount() }, () => '<div class="half-practice"></div>').join('');
      return `
        <div class="half-col">
          <div class="std-cell half-kanji"><span class="std-vtext">${kanji}</span></div>
          <div class="std-cell half-mark"></div>
          <div class="std-cell half-yomi"><span class="std-vtext">${yomi}</span></div>
          ${practices}
        </div>
      `;
    }

    function halfPageHtml(pageItems, title, number, numAdjustClass, id) {
      const padded = pageItems.concat(Array(Math.max(0, HALF_COLS - pageItems.length)).fill(null));
      const colsHtml = padded.map(halfColumn).join('');
      return `
        <div class="print-paper template-half">
          <div class="half-table">
            <div class="half-col label">
              <div class="std-cell half-kanji">漢字</div>
              <div class="std-cell half-mark"></div>
              <div class="std-cell half-yomi">読み</div>
              <div class="half-label-practice"></div>
            </div>
            ${colsHtml}
          </div>
          ${metaAsideHtml(title, number, numAdjustClass, id)}
        </div>
      `;
    }

    function renderHalf() {
      const items = parseItems();
      const title = formatTitleVerticalHtml(titleInput.value);
      const number = toHalfWidthDigits(numberInput.value);
      const numAdjustClass = getNumTextAdjustClass(numberInput.value);
      const id = idInput.value;
      const pageCount = Math.max(1, Math.ceil(items.length / HALF_COLS) || 1);
      const pages = [];
      for (let i = 0; i < pageCount; i++) {
        pages.push(halfPageHtml(
          items.slice(i * HALF_COLS, (i + 1) * HALF_COLS),
          title, number, numAdjustClass, id
        ));
      }
      previewArea.className = 'preview-pages';
      previewArea.innerHTML = pages.join('');
    }

    function testPromptHtml(item) {
      if (!item) return '';
      if (item.hasSep) return item.yomiHtml;
      return formatYomiHtml(item.kanji);
    }

    function testCellHtml(item, indexInHalf) {
      const prompt = testPromptHtml(item);
      const mark = CIRCLED_NUMS[indexInHalf] || String(indexInHalf + 1);
      return `
        <div class="test-q">
          <div class="test-q-num">${mark}</div>
          <div class="test-q-yomi"><span class="std-vtext">${prompt}</span></div>
          <div class="test-q-write"></div>
        </div>
      `;
    }

    function testHeaderHtml(title, number, numAdjustClass, id) {
      return `
        <div class="test-header">
          <div class="std-id">${id}</div>
          ${numBoxHtml(number, numAdjustClass)}
          <div class="std-title-wrap">
            <div class="std-title">${title}</div>
          </div>
          <img class="std-logo" src="timer_logo_v2_3.png" alt="">
        </div>
      `;
    }

    function testHalfHtml(halfItems, title, number, numAdjustClass, id) {
      const padded = padItems(halfItems, TEST_PER_HALF);
      const rows = [];
      for (let r = 0; r < TEST_ROWS_PER_HALF; r++) {
        const cells = [];
        for (let c = 0; c < TEST_COLS; c++) {
          const idx = r * TEST_COLS + c;
          cells.push(testCellHtml(padded[idx], idx));
        }
        rows.push(`<div class="test-row">${cells.join('')}</div>`);
      }
      return `
        <div class="test-half">
          <div class="test-grid">${rows.join('')}</div>
          ${testHeaderHtml(title, number, numAdjustClass, id)}
        </div>
      `;
    }

    function testPageHtml(pageItems, title, number, numAdjustClass, id) {
      const top = pageItems.slice(0, TEST_PER_HALF);
      const bottom = pageItems.slice(TEST_PER_HALF, TEST_PER_PAGE);
      return `
        <div class="print-paper template-test">
          ${testHalfHtml(top, title, number, numAdjustClass, id)}
          ${testHalfHtml(bottom, title, number, numAdjustClass, id)}
        </div>
      `;
    }

    function renderTest() {
      const items = parseItems();
      const title = formatTitleVerticalHtml(titleInput.value);
      const number = toHalfWidthDigits(numberInput.value);
      const numAdjustClass = getNumTextAdjustClass(numberInput.value);
      const id = idInput.value;
      const pageCount = Math.max(1, Math.ceil(items.length / TEST_PER_PAGE) || 1);
      const pages = [];
      for (let i = 0; i < pageCount; i++) {
        pages.push(testPageHtml(
          items.slice(i * TEST_PER_PAGE, (i + 1) * TEST_PER_PAGE),
          title, number, numAdjustClass, id
        ));
      }
      previewArea.className = 'preview-pages';
      previewArea.innerHTML = pages.join('');
    }

    function updatePrintPageStyle(mode) {
      const css = (mode === 'half' || mode === 'twin' || mode === 'test')
        ? '@page { size: A4 portrait; margin: 0; }'
        : '@page { size: A4 landscape; margin: 0; }';
      printPageStyle.textContent = css;
      document.head.appendChild(printPageStyle);
    }

    function resetPreviewForPrint() {
      previewScaler.style.transform = '';
      previewScaler.style.transformOrigin = '';
      previewScaler.style.width = '';
      previewScaler.style.height = '';
    }

    function fitPreview() {
      if (window.matchMedia('print').matches) return;

      const shellPad = 64;
      const availW = Math.max(0, previewShell.clientWidth - shellPad);
      const availH = Math.max(0, previewShell.clientHeight - shellPad);
      const paperW = previewArea.offsetWidth;
      const paperH = previewArea.offsetHeight;
      if (!paperW || !paperH) return;

      const isScrollPreview = templateSelect.value === 'half' || templateSelect.value === 'test';
      const scale = isScrollPreview
        ? Math.min(1, availW / paperW)
        : Math.min(1, availW / paperW, availH / paperH);
      previewScaler.style.transform = `scale(${scale})`;
      previewScaler.style.transformOrigin = 'top left';
      previewScaler.style.width = `${paperW * scale}px`;
      previewScaler.style.height = `${paperH * scale}px`;
    }

    function renderPrint() {
      if (templateSelect.value === 'half') renderHalf();
      else if (templateSelect.value === 'twin') renderTwin();
      else if (templateSelect.value === 'test') renderTest();
      else renderStandard();
      requestAnimationFrame(fitPreview);
    }

    function updateFontSettings() {
      const kanjiScale = kanjiSizeSlider.value;
      const yomiScale = yomiSizeSlider.value;
      const yomiHScale = yomiHeightSlider.value;
      const idScale = idSizeSlider.value;
      const titleScale = titleSizeSlider.value;
      document.documentElement.style.setProperty('--kanji-scale', kanjiScale);
      document.documentElement.style.setProperty('--yomi-scale', yomiScale);
      document.documentElement.style.setProperty('--yomi-h-scale', yomiHScale);
      document.documentElement.style.setProperty('--id-scale', idScale);
      document.documentElement.style.setProperty('--title-scale', titleScale);
      document.documentElement.style.setProperty('--practice-rows', String(getPracticeCount()));
      document.documentElement.style.setProperty('--half-practice-rows', String(getHalfCellCount()));
      kanjiSizeDisplay.textContent = Number(kanjiScale).toFixed(2) + 'x';
      yomiSizeDisplay.textContent = Number(yomiScale).toFixed(2) + 'x';
      yomiHeightDisplay.textContent = Number(yomiHScale).toFixed(2) + 'x';
      idSizeDisplay.textContent = Number(idScale).toFixed(2) + 'x';
      titleSizeDisplay.textContent = Number(titleScale).toFixed(2) + 'x';
      syncPracticeSlider();
      previewArea.classList.toggle('font-gothic', fontSelect.value === 'gothic');
      previewArea.querySelectorAll('.print-paper').forEach(el => {
        el.classList.toggle('font-gothic', fontSelect.value === 'gothic');
      });
    }

    function parseTemplateParam(raw) {
      const value = String(raw || '').trim().toLowerCase();
      if (value === 'half' || value === 'ハーフ' || value === 'ハーフサイズ') return 'half';
      if (value === 'twin' || value === 'ツイン' || value === '上下' || value === '12+13') return 'twin';
      if (value === 'test' || value === 'テスト' || value === '5問4行') return 'test';
      if (value === 'standard' || value === 'std' || value === 'スタンダード') return 'standard';
      return null;
    }

    function applyStateFromUrl() {
      const params = new URLSearchParams(location.search);
      const template = parseTemplateParam(params.get('template'));
      if (template) templateSelect.value = template;
      if (params.has('title')) titleInput.value = params.get('title');
      if (params.has('number')) numberInput.value = params.get('number');
      if (params.has('id')) idInput.value = params.get('id');
      if (params.has('data')) input.value = params.get('data');
      const font = params.get('font');
      if (font === 'gothic' || font === 'kyokasho') fontSelect.value = font;
      if (params.has('kanji')) kanjiSizeSlider.value = params.get('kanji');
      if (params.has('yomi')) yomiSizeSlider.value = params.get('yomi');
      if (params.has('yomih')) yomiHeightSlider.value = params.get('yomih');
      if (params.has('idsize')) idSizeSlider.value = params.get('idsize');
      if (params.has('titlesize')) titleSizeSlider.value = params.get('titlesize');
      if (params.has('practice')) savedPracticeRounds = clampInt(params.get('practice'), PRACTICE_ROUND_MIN, PRACTICE_ROUND_MAX, 3);
      if (params.has('cells')) savedHalfCells = clampInt(params.get('cells'), HALF_CELL_MIN, HALF_CELL_MAX, 10);
    }

    function syncStateToUrl() {
      const url = new URL(location.href);
      const params = url.searchParams;
      params.set('template', templateSelect.value);
      params.set('title', titleInput.value);
      params.set('number', numberInput.value);
      params.set('id', idInput.value);
      params.set('data', input.value);
      params.set('font', fontSelect.value);
      params.set('kanji', kanjiSizeSlider.value);
      params.set('yomi', yomiSizeSlider.value);
      params.set('yomih', yomiHeightSlider.value);
      params.set('idsize', idSizeSlider.value);
      params.set('titlesize', titleSizeSlider.value);
      params.set('practice', String(getPracticeCount()));
      params.set('cells', String(getHalfCellCount()));
      history.replaceState(null, '', url);
    }

    let urlSyncTimer = null;
    function scheduleUrlSync() {
      clearTimeout(urlSyncTimer);
      urlSyncTimer = setTimeout(syncStateToUrl, 250);
    }

    function changeTemplate() {
      const mode = templateSelect.value;
      if (!fontSelect.disabled) fontSelect.value = 'kyokasho';
      kanjiSizeSlider.value = '1.0';
      yomiSizeSlider.value = '1.0';
      yomiHeightSlider.value = '1.0';
      idSizeSlider.value = '1.0';
      titleSizeSlider.value = '1.0';
      updatePrintPageStyle(mode);
      updateFontSettings();
      renderPrint();
      syncStateToUrl();
    }

    function resetStyleDefaults() {
      if (!fontSelect.disabled) fontSelect.value = 'kyokasho';
      kanjiSizeSlider.value = '1.0';
      yomiSizeSlider.value = '1.0';
      yomiHeightSlider.value = '1.0';
      idSizeSlider.value = '1.0';
      titleSizeSlider.value = '1.0';
      savedPracticeRounds = 3;
      savedHalfCells = 10;
      updateFontSettings();
      renderPrint();
      syncStateToUrl();
    }

    input.addEventListener('input', () => {
      applyMetaFromData();
      updateFontSettings();
      renderPrint();
      scheduleUrlSync();
    });
    templateSelect.addEventListener('change', changeTemplate);
    fontSelect.addEventListener('change', () => {
      updateFontSettings();
      renderPrint();
      scheduleUrlSync();
    });
    kanjiSizeSlider.addEventListener('input', () => {
      updateFontSettings();
      scheduleUrlSync();
    });
    yomiSizeSlider.addEventListener('input', () => {
      updateFontSettings();
      scheduleUrlSync();
    });
    yomiHeightSlider.addEventListener('input', () => {
      updateFontSettings();
      scheduleUrlSync();
    });
    idSizeSlider.addEventListener('input', () => {
      updateFontSettings();
      scheduleUrlSync();
    });
    titleSizeSlider.addEventListener('input', () => {
      updateFontSettings();
      scheduleUrlSync();
    });
    practiceCountSlider.addEventListener('input', () => {
      readPracticeSlider();
      updateFontSettings();
      renderPrint();
      scheduleUrlSync();
    });
    document.getElementById('styleResetBtn').addEventListener('click', resetStyleDefaults);
    titleInput.addEventListener('input', () => {
      clampTitleInput();
      renderPrint();
      scheduleUrlSync();
    });
    numberInput.addEventListener('input', () => {
      renderPrint();
      scheduleUrlSync();
    });
    idInput.addEventListener('input', () => {
      renderPrint();
      scheduleUrlSync();
    });
    window.addEventListener('resize', fitPreview);
    document.getElementById('printBtn').addEventListener('click', () => {
      updatePrintPageStyle(templateSelect.value);
      resetPreviewForPrint();
      window.print();
    });
    window.addEventListener('beforeprint', () => {
      updatePrintPageStyle(templateSelect.value);
      resetPreviewForPrint();
    });
    window.addEventListener('afterprint', fitPreview);
    if (window.matchMedia) {
      window.matchMedia('print').addEventListener('change', (event) => {
        if (event.matches) {
          updatePrintPageStyle(templateSelect.value);
          resetPreviewForPrint();
        } else {
          fitPreview();
        }
      });
    }

    applyStateFromUrl();
    applyMetaFromData();
    updatePrintPageStyle(templateSelect.value);
    renderPrint();
    updateFontSettings();
  </script>
</body>
</html>
